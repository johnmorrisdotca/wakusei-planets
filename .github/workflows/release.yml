name: Release
# Run by hand (Actions → Release → Run workflow) from main, or push a v<version> tag. It refuses unless the CI workflow has succeeded on this commit (the ci-green job). The steps are then
# kazoku-ui's shared release workflow (docs/release-workflow.md there): check the tag, run the check and the freeze test below, tag, and publish to npm by trusted publishing, with provenance,
# and attach the packed tarball to a GitHub release. npm trusts THIS file by name (npmjs.com → the package → Settings → Trusted Publisher: release.yml), so publishing needs no token and no secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  id-token: write
jobs:
  ci-green:
    runs-on: ubuntu-latest
    steps:
      - name: CI has succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url --jq '.[0] | "\(.status) \(.conclusion) \(.url)"')"
          echo "The latest CI run of $GITHUB_SHA: ${RUN:-none}"
          case "$RUN" in
            "completed success "*) ;;
            *) echo "::error::CI has not succeeded on $GITHUB_SHA. Wait for it to pass (or fix it), then run the release again."; exit 1 ;;
          esac
  release:
    needs: ci-green
    uses: johnmorrisdotca/kazoku-ui/.github/workflows/reusable-release.yml@v0.44.0
    with:
      check-command: pnpm check && pnpm test:package
      freeze-command: pnpm test:freeze
      require-ci-workflow: ci.yml
      github-release: true
  data-files:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check out the released tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          git fetch origin "refs/tags/v${version}:refs/tags/v${version}"
          git checkout --detach "v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm export:data
      - run: python3 -m venv "${RUNNER_TEMP}/venv" && "${RUNNER_TEMP}/venv/bin/pip" install pyarrow
      - run: '"${RUNNER_TEMP}/venv/bin/python" -I scripts/export-parquet.py dist-data'
      - name: Attach the data files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -qr "${RUNNER_TEMP}/wakusei-planets-data-v${VERSION}.zip" dist-data
          gh release upload "v${VERSION}" "${RUNNER_TEMP}/wakusei-planets-data-v${VERSION}.zip" dist-data/*.csv dist-data/*.parquet dist-data/*.json dist-data/SHA256SUMS dist-data/LICENCE-DATA.md --clobber
