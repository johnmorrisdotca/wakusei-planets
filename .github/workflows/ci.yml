name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pillow and numpy, for the tile script's own test (pnpm test skips it without them)
        run: python3 -m venv .cache/venv && .cache/venv/bin/pip install pillow numpy
      - name: Lint, types, unit tests with the coverage floor, build, package, size budget
        run: pnpm check
      - run: node scripts/check-standard.mjs
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports
        run: pnpm test:package
  usage:
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Every way of using it in the README and the guides, built and opened in a browser
        run: pnpm test:usage
  demo:
    # One job a Playwright project: the four are the same tests at a desk's and a phone's width in Chromium and in WebKit. The desk's Chromium draws every body in software, so it is dealt out to ten jobs (`--shard`).
    # 25 minutes: shard 2 of 6 sat at 14:44 of 15 and was cancelled on 2026-11-10 (MODULES-766); eight shards and room for a slow apt mirror. Ten from 2026-11-19: shard 7 of 8 took 22 of its 25 minutes at 0.67.0, and with 0.68.0's specs it ran past 25 and was cancelled twice (run 44338921430).
    name: demo (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium-desk, shard: 1/10 }
          - { project: chromium-desk, shard: 2/10 }
          - { project: chromium-desk, shard: 3/10 }
          - { project: chromium-desk, shard: 4/10 }
          - { project: chromium-desk, shard: 5/10 }
          - { project: chromium-desk, shard: 6/10 }
          - { project: chromium-desk, shard: 7/10 }
          - { project: chromium-desk, shard: 8/10 }
          - { project: chromium-desk, shard: 9/10 }
          - { project: chromium-desk, shard: 10/10 }
          - { project: chromium-phone, shard: 1/1 }
          - { project: webkit-desk, shard: 1/1 }
          - { project: webkit-phone, shard: 1/1 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: ${{ startsWith(matrix.project, 'webkit') && 'webkit' || 'chromium' }}
      - name: The demo and the docs site, played in one browser at one width (pnpm test:demo plays all four)
        run: pnpm test:demo:one --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: The pictures the tests write for a person to look at (test-results/evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/evidence
          if-no-files-found: ignore
          retention-days: 14
  freeze:
    # Four jobs of the freeze test, dealt out by test (`--shard`; the project is `fullyParallel`, so a file is split between jobs, and the tests are independent: each opens its own page).
    # The 66 tests took 20.7 minutes in one job, and with the soak and the install the job reached its 25-minute limit and was cancelled on 2026-11-18 (the 0.62.0 and 0.63.0 runs), which blocks the release.
    # By shard they take 2 to 8 minutes each, and the job has 25.
    name: freeze (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: The freeze test, WebGL drawn in software
        run: pnpm test:freeze --shard=${{ matrix.shard }}
  soak:
    # The one-minute soak (two tests, 3 to 5 minutes) has a job of its own, so it does not wait behind the freeze test.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: The soak, one minute (ten minutes by hand with pnpm test:soak)
        run: SOAK_MINUTES=1 pnpm test:soak
  commits:
    # A pushed commit message never names an AI as author or co-author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="HEAD~1..HEAD"
          if git log --format='%an %ae%n%cn %ce%n%B' "$range" | grep -i -E 'co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt)|noreply@anthropic|noreply@openai'; then
            echo "A commit names an AI as author (see AGENTS.md: no AI attribution)"; exit 1
          fi
