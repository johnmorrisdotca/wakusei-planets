# Publishes the demo to GitHub Pages on every push to main. Nothing here costs
# anything on a public repository. The site is built in one job (which a branch can run by hand with
# workflow_dispatch, to try a change to the build) and published by another that only main may run.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 -m venv .cache/venv && .cache/venv/bin/pip install pillow numpy
      - run: pnpm check
      - name: The body tiles, cut from the big public-domain maps (kept between runs while the script and the 2048 pictures are the same); pnpm site copies them to site/tiles
        uses: actions/cache@v6
        id: tiles
        with:
          path: .cache/body-tiles-out
          key: body-tiles-${{ hashFiles('scripts/make-body-tiles.py', 'textures/*-2048.webp') }}-${{ vars.WAKUSEI_SHARP_TILES }}
      - if: steps.tiles.outputs.cache-hit != 'true'
        run: pnpm tiles
      - name: Sharper Moon and Mars tiles (off until the repository variable WAKUSEI_SHARP_TILES is 1; the sources are not downloaded otherwise)
        if: vars.WAKUSEI_SHARP_TILES == '1' && steps.tiles.outputs.cache-hit != 'true'
        run: sudo apt-get install -y gdal-bin && WAKUSEI_SHARP_TILES=1 pnpm tiles:moon && WAKUSEI_SHARP_TILES=1 pnpm tiles:mars
      - name: The Moon's ground tiles for <wakusei-surface>, made from three public-domain NASA files (kept between runs while the script is the same; when the cache hits nothing is downloaded). The files are fetched in ranges with retries and their SHA-256 are checked; a file that is not the one NOTICE.md names stops the build. pnpm site copies the tiles to site/tiles/moon
        uses: actions/cache@v6
        id: moon
        with:
          path: .cache/moon-terrain-out
          key: moon-terrain-${{ hashFiles('scripts/make-moon-terrain.py') }}
      - if: steps.moon.outputs.cache-hit != 'true'
        run: |
          .cache/venv/bin/python -I scripts/make-moon-terrain.py fetch --sources .cache/moon-terrain-sources
          .cache/venv/bin/python -I scripts/make-moon-terrain.py build --sources .cache/moon-terrain-sources
      - run: pnpm site
      - run: pnpm docs:site
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: The ready-made PDFs of the colouring sheets
        run: node scripts/make-pdfs.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    # only main publishes (the github-pages environment allows nothing else); a branch run stops after the build
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
