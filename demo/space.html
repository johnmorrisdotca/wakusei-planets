<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1424'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%2313203a' stroke='%238fa1b8' stroke-width='4'/%3E%3Cellipse cx='50' cy='50' rx='42' ry='12' fill='none' stroke='%238fa1b8' stroke-width='3' transform='rotate(-20 50 50)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <!--family:header-->

      <section class="fam-felt space-stage" aria-labelledby="stage-h">
        <h2 id="stage-h" class="fam-sr" data-say="sp_stage">Space view</h2>
        <div id="sky" class="body-view" role="group" aria-label="Space view" data-say-label="sp_stage">
          <wakusei-space id="space" tabindex="0" time="now" speed="0" look="realistic" texture-base="textures/" tiles="tiles/"></wakusei-space>
        </div>
        <p class="fam-fine stage-name" id="caption" role="status"></p>
        <p class="fam-fine" id="scale-note" role="status"></p>
      </section>
      <kazoku-view-controls id="controls" for="space" controls="advanced" address speed="0"></kazoku-view-controls>

      <div class="fam-panels">
        <div class="fam-panel controls">
          <p class="fam-fine" data-say="sp_help">Drag to turn the view.</p>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_goto">Go to</span>
            <div class="group fam-seg" id="gotos" role="group" aria-label="Go to" data-say-label="sp_goto">
              <button type="button" data-goto="earth" aria-pressed="true" data-say="sp_goto_earth">Earth</button>
              <button type="button" data-goto="moon" aria-pressed="false" data-say="sp_goto_moon">Moon</button>
              <button type="button" data-goto="sun" aria-pressed="false" data-say="sp_goto_sun">Sun</button>
              <button type="button" data-goto="inner" aria-pressed="false" data-say="sp_goto_inner">Inner planets</button>
              <button type="button" data-goto="solar-system" aria-pressed="false" data-say="sp_goto_solar">Whole solar system</button>
              <button type="button" data-goto="jupiter-moons" aria-pressed="false" data-say="sp_goto_jupiter">Jupiter and its moons</button>
            </div>
          </div>
          <div class="fam-row" data-help-en="Backing out from the Sun by stages: the inner planets, the asteroid belt, the outer planets, the Kuiper belt, then the whole system. Step out goes one stage further out, Step in one stage back in (to the Sun from the first); at a stage a zoom gesture does the same. The stage's name is shown in the corner of the view." data-help-ja="太陽から段階を追って引いていきます。内太陽系、小惑星帯、外太陽系、カイパーベルト、太陽系全体の順です。「外側へ」は一段階外側へ、「内側へ」は一段階内側へ (最初の段階からは太陽へ) 進みます。段階にいるときは、ズーム操作も同じ働きをします。段階の名前はビューの隅に出ます。">
            <span class="fam-label" data-say="sp_stages">Stages</span>
            <div class="group fam-seg" role="group" aria-label="Stages" data-say-label="sp_stages">
              <button type="button" class="fam-button" id="step-in" data-say="sp_step_in">Step in</button>
              <button type="button" class="fam-button" id="step-out" data-say="sp_step_out">Step out</button>
            </div>
            <output id="stage-name" class="fam-fine" aria-live="polite"></output>
          </div>
          <div class="fam-row" data-help-en="How the camera moves from one body to the next. Turn then travel turns beside the body you are leaving until the next one is in the picture, then travels to it with it in view the whole way; Direct goes straight at it; Look back pulls away watching the body you are leaving; Auto is Direct when the next body is already in view and Turn then travel when it is not; Cut jumps. Length scales how long a move takes (2× is twice as long)." data-help-ja="カメラが天体から天体へどう動くかです。「回ってから進む」は、離れる天体のそばで次の天体が画面に入るまで向きを変え、そのあとは次の天体を見たまま進みます。「まっすぐ」は次の天体へまっすぐ向かい、「振り返る」は離れる天体を見ながら遠ざかります。「自動」は、次の天体がすでに見えていれば「まっすぐ」、見えていなければ「回ってから進む」になります。「ジャンプ」は一瞬で切り替わります。「かかる時間」は、移動にかかる時間の倍率です (2なら倍の時間がかかります)。">
            <span class="fam-label" data-say="sp_transition">Travel</span>
            <div class="group fam-seg" id="transitions" role="group" aria-label="Travel" data-say-label="sp_transition">
              <button type="button" data-transition="turn-travel" aria-pressed="true" data-say="sp_tr_turn">Turn then travel</button>
              <button type="button" data-transition="direct" aria-pressed="false" data-say="sp_tr_direct">Direct</button>
              <button type="button" data-transition="look-back" aria-pressed="false" data-say="sp_tr_lookback">Look back</button>
              <button type="button" data-transition="auto" aria-pressed="false" data-say="sp_tr_auto">Auto</button>
              <button type="button" data-transition="cut" aria-pressed="false" data-say="sp_tr_cut">Cut</button>
            </div>
            <span class="fam-label" data-say="sp_pace">Length</span>
            <div class="group fam-seg" id="paces" role="group" aria-label="Length" data-say-label="sp_pace">
              <button type="button" data-pace="0.5" aria-pressed="false">0.5×</button>
              <button type="button" data-pace="1" aria-pressed="true">1×</button>
              <button type="button" data-pace="2" aria-pressed="false">2×</button>
              <button type="button" data-pace="4" aria-pressed="false">4×</button>
            </div>
          </div>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_find">Find a body</span>
            <div class="group fam-seg" id="kinds" role="group" aria-label="Kind" data-say-label="sp_kind">
              <button type="button" data-kind="planet" aria-pressed="true" data-say="sp_kind_planet">Sun and planets</button>
              <button type="button" data-kind="dwarf-planet" aria-pressed="false" data-say="sp_kind_dwarf">Dwarf planets</button>
              <button type="button" data-kind="minor" aria-pressed="false" data-say="sp_kind_minor">Small bodies</button>
              <button type="button" data-kind="moon" aria-pressed="false" data-say="sp_kind_moon">Moons</button>
            </div>
            <label class="field"><span class="fam-sr" data-say="sp_search">Search by name</span><input type="search" id="find" list="find-list" class="fam-field" autocomplete="off" /></label>
            <datalist id="find-list"></datalist>
          </div>
          <div class="fam-row" id="hosts-row" hidden>
            <span class="fam-label" data-say="sp_host">Planet</span>
            <div class="group fam-seg" id="hosts" role="group" aria-label="Planet" data-say-label="sp_host"></div>
          </div>
          <div class="fam-row">
            <div class="group fam-seg" id="choices" role="group" aria-label="Body" data-say-label="sp_body"></div>
            <button type="button" class="fam-button" id="system" hidden data-say="sp_system">With its moons</button>
          </div>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_hop">Hop</span>
            <div class="group fam-seg" id="hops" role="group" aria-label="Hop" data-say-label="sp_hop">
              <button type="button" id="hop-prev" aria-label="Previous body">&#8249; <span id="hop-prev-name"></span></button>
              <button type="button" id="hop-next" aria-label="Next body"><span id="hop-next-name"></span> &#8250;</button>
            </div>
            <span class="fam-fine" id="hop-now" role="status"></span>
            <button type="button" class="fam-button" id="go-there" hidden data-say="sp_go">Go there</button>
          </div>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_scale">Scale</span>
            <div class="group fam-seg" id="scales" role="group" aria-label="Scale" data-say-label="sp_scale">
              <button type="button" data-scale="true" aria-pressed="true" data-say="sp_scale_true">True</button>
              <button type="button" data-scale="compressed" aria-pressed="false" data-say="sp_scale_compressed">Compressed</button>
            </div>
            <span class="fam-label" data-say="sp_look">Look</span>
            <div class="group fam-seg" id="looks" role="group" aria-label="Look" data-say-label="sp_look">
              <button type="button" data-look="realistic" aria-pressed="true" data-say="look_realistic">Realistic</button>
              <button type="button" data-look="painted" aria-pressed="false" data-say="look_painted">Painted</button>
            </div>
          </div>
          <div class="fam-row" data-help-en="Orbits draws each path with small arrows that show which way the body goes. Names puts the name by each body. With Help on, the body in the middle also shows its axis and a curved arrow for the way it spins." data-help-ja="「軌道」は天体の通り道を線で描き、小さな矢印で進む向きを示します。「名前」は天体の横に名前を出します。「説明」をオンにすると、真ん中の天体の軸と、自転の向きを示す曲がった矢印も出ます。">
            <span class="fam-label" data-say="sp_light">Light</span>
            <div class="group fam-seg" id="lights" role="group" aria-label="Light" data-say-label="sp_light">
              <button type="button" data-light="sun" aria-pressed="true" data-say="sp_light_sun">The Sun's</button>
              <button type="button" data-light="lit" aria-pressed="false" data-say="sp_light_lit">Always lit</button>
            </div>
            <span class="fam-label" data-say="sp_show">Show</span>
            <button type="button" class="fam-button" id="orbits" aria-pressed="true" data-say="sp_orbits">Orbits</button>
            <button type="button" class="fam-button" id="names" aria-pressed="true" data-say="sp_names">Names</button>
            <button type="button" class="fam-button" id="starman" aria-pressed="false" data-say="sp_starman">Starman</button>
            <button type="button" class="fam-button" id="orbiters" aria-pressed="false" data-say="sp_orbiters">Orbiters</button>
            <button type="button" class="fam-button" id="all-moons" aria-pressed="false" data-say="sp_all_moons">All moons</button>
            <button type="button" class="fam-button" id="belts" aria-pressed="true" data-say="sp_belts">Belts</button>
          </div>
          <div class="fam-row" id="orbiter-row" hidden data-help-en="Pick a craft to see its numbers, where its path comes from, and its next pass over a famous landing site. Tracked is within the fit to Horizons' track; predicted is that fit carried on past it; modelled is a mean orbit only, drawn dim." data-help-ja="探査機を選ぶと、数値、経路のもとになったデータ、有名な着陸地点の上を次に通る時刻が出ます。「追跡」はHorizonsの経路に合わせた期間の中、「予測」は合わせた軌道をその期間のあとへのばしたもの、「モデル」は平均の軌道だけで、暗く描きます。">
            <span class="fam-label" data-say="sp_craft">Craft</span>
            <span class="orbiter-pair"><span class="fam-fine" data-say="sp_craft_moon">Round the Moon</span><span class="group fam-seg" id="orbiter-picks-moon" role="group" aria-label="Round the Moon" data-say-label="sp_craft_moon"></span></span>
            <span class="orbiter-pair"><span class="fam-fine" data-say="sp_craft_mars">Round Mars</span><span class="group fam-seg" id="orbiter-picks-mars" role="group" aria-label="Round Mars" data-say-label="sp_craft_mars"></span></span>
          </div>
          <div class="fam-row" id="orbiter-tools" hidden>
            <span class="fam-label" data-say="sp_olines">Orbit lines</span>
            <div class="group fam-seg" id="orbiter-lines" role="group" aria-label="Orbit lines" data-say-label="sp_olines">
              <button type="button" data-olines="all" aria-pressed="true" data-say="sp_olines_all">All</button>
              <button type="button" data-olines="chosen" aria-pressed="false" data-say="sp_olines_chosen">Chosen craft</button>
              <button type="button" data-olines="none" aria-pressed="false" data-say="sp_olines_none">None</button>
            </div>
            <button type="button" class="fam-button" id="orbiter-track" aria-pressed="false" data-say="sp_otrack">Ground track</button>
          </div>
          <div class="fam-fine orbiter-card" id="orbiter-card" role="status" hidden></div>
          <div class="fam-row" data-help-en="Name on the body writes each body's name on its globe, like a title laid over the thing it names: it turns with the body (or faces you), once or on both sides, at the equator or near a pole, in four looks and three strengths. Nothing is drawn on a body too small on the screen." data-help-ja="「天体に名前」は、天体の名前をその球面に書きます。映画のタイトルのように天体に重なり、天体とともに回ります (「こちらを向く」なら見る人のほうを向いたまま)。一つか両側か、赤道か極の近くか、四つの見た目と三つの強さを選べます。画面上で小さい天体には描きません。">
            <span class="fam-label" data-say="bl">Name on the body</span>
            <div class="group fam-seg" id="body-labels" role="group" aria-label="Name on the body" data-say-label="bl">
              <button type="button" data-bl="" aria-pressed="true" data-say="bl_off">Off</button>
              <button type="button" data-bl="painted" aria-pressed="false" data-say="bl_painted">Painted</button>
              <button type="button" data-bl="etched" aria-pressed="false" data-say="bl_etched">Etched</button>
              <button type="button" data-bl="outline" aria-pressed="false" data-say="bl_outline">Outline</button>
              <button type="button" data-bl="burned" aria-pressed="false" data-say="bl_burned">Burned in</button>
            </div>
            <div class="group fam-seg" id="body-label-repeats" role="group" aria-label="How many" data-say-label="bl_repeat">
              <button type="button" data-blr="once" aria-pressed="true" data-say="bl_once">Once</button>
              <button type="button" data-blr="both" aria-pressed="false" data-say="bl_both">Both sides</button>
              <button type="button" data-blr="around" aria-pressed="false" data-say="bl_around">All round</button>
            </div>
            <div class="group fam-seg" id="body-label-wheres" role="group" aria-label="Where" data-say-label="bl_where">
              <button type="button" data-bll="0" aria-pressed="true" data-say="bl_equator">Equator</button>
              <button type="button" data-bll="55" aria-pressed="false" data-say="bl_north">North</button>
              <button type="button" data-bll="-55" aria-pressed="false" data-say="bl_south">South</button>
            </div>
            <div class="group fam-seg" id="body-label-strengths" role="group" aria-label="Strength" data-say-label="bl_strength">
              <button type="button" data-bls="0.25" aria-pressed="false" data-say="bl_faint">Faint</button>
              <button type="button" data-bls="0.5" aria-pressed="true" data-say="bl_half">Half</button>
              <button type="button" data-bls="1" aria-pressed="false" data-say="bl_full">Full</button>
            </div>
            <button type="button" class="fam-button" id="body-label-facing" aria-pressed="false" data-say="bl_facing">Facing you</button>
          </div>
          <div class="fam-row" data-help-en="Places marks where craft landed, drove, crashed or are planned to land, and the named features, on the Moon, Mars and 31 more bodies. Each layer goes on and off by itself. Hover or touch a mark for its name; the marks turn with the body and hide on the far side." data-help-ja="「場所」は、探査機が着陸した場所や墜落した場所、探査車が走った場所、着陸する予定の場所、名前のある地形に印をつけます。月、火星など33の天体で使えます。種類ごとにオンとオフを切り替えられます。印にカーソルを合わせるかタッチすると名前が出ます。印は天体といっしょに回り、裏側では隠れます。">
            <span class="fam-label" data-say="pl">Places</span>
            <div class="group fam-seg" id="place-layers" role="group" aria-label="Places" data-say-label="pl">
              <button type="button" data-layer="landing" aria-pressed="false" data-say="pl_landing">Landings</button>
              <button type="button" data-layer="crash" aria-pressed="false" data-say="pl_crash">Crashes</button>
              <button type="button" data-layer="planned" aria-pressed="false" data-say="pl_planned">Planned</button>
              <button type="button" data-layer="feature" aria-pressed="false" data-say="pl_feature">Features</button>
            </div>
            <span class="fam-label" data-say="pl_go">Go to</span>
            <div class="group fam-seg" id="place-gos" role="group" aria-label="Go to a place" data-say-label="pl_go_place">
              <button type="button" data-place="moon/apollo-11-lunar-module" data-body="moon" data-say="pl_apollo11">Apollo 11</button>
              <button type="button" data-place="mars/perseverance" data-body="mars" data-say="pl_perseverance">Perseverance</button>
              <button type="button" data-place="mars/olympus-mons" data-body="mars" data-say="pl_olympus">Olympus Mons</button>
            </div>
            <span class="fam-fine" id="place-picked" role="status"></span>
          </div>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_ride">Ride along</span>
            <div class="group fam-seg" id="rides" role="group" aria-label="Ride along" data-say-label="sp_ride">
              <button type="button" data-ride="" aria-pressed="true" data-say="sp_ride_off">Off</button>
              <button type="button" data-ride="moon" aria-pressed="false" data-say="sp_ride_moon">The Moon</button>
              <button type="button" data-ride="moon:beside" aria-pressed="false" data-say="sp_ride_beside">Beside the Moon</button>
              <button type="button" data-ride="mars" aria-pressed="false" data-say="sp_ride_mars">Mars</button>
              <button type="button" data-ride="io" aria-pressed="false" data-say="sp_ride_io">Io, over Jupiter</button>
              <button type="button" data-ride="orbiter" aria-pressed="false" data-say="sp_ride_orbiter" hidden>The chosen craft</button>
              <button type="button" data-ride="belt:main" aria-pressed="false" data-say="sp_ride_belt">Through the main belt</button>
            </div>
            <span class="fam-label" data-say="sp_ride_look">Looking</span>
            <div class="group fam-seg" id="ride-looks" role="group" aria-label="Looking" data-say-label="sp_ride_look">
              <button type="button" data-ride-look="down" aria-pressed="true" data-say="sp_ride_down">Straight down</button>
              <button type="button" data-ride-look="horizon" aria-pressed="false" data-say="sp_ride_horizon">At the horizon</button>
            </div>
          </div>
          <div class="fam-row">
            <label class="field">
              <span data-say="sp_when">Date and time</span>
              <input type="datetime-local" id="when" class="fam-field" />
            </label>
            <button type="button" class="fam-button" id="now" aria-pressed="true" data-say="sp_now">Now</button>
            <kazoku-replay-bar id="replay" data-testid="replay" steps="1 3600 86400 -3600" speed="3600"></kazoku-replay-bar>
          </div>
        </div>
        <section class="fam-panel moon-list" id="moon-list" aria-labelledby="moon-list-h" hidden>
          <h2 id="moon-list-h" class="fam-label"></h2>
          <p class="fam-fine" id="moon-count" role="status"></p>
          <div class="group fam-seg" id="moon-groups" role="group" aria-label="Group" data-say-label="sp_moon_group"></div>
          <div class="fam-table-box moon-table-box">
            <table>
              <thead>
                <tr><th scope="col" data-say="sp_moon_name">Name</th><th scope="col" data-say="sp_moon_group">Group</th><th scope="col" data-say="sp_moon_found">Found</th><th scope="col" data-say="sp_moon_size">Radius</th><th scope="col" data-say="sp_moon_grade">Place</th></tr>
              </thead>
              <tbody id="moon-rows"></tbody>
            </table>
          </div>
        </section>
      </div>

      <p class="fam-fine credits" id="place-credit" hidden></p>
      <p class="fam-fine credits" id="door-credit" data-testid="door-credit"></p>

      <!--family:unreviewed-->
      <!--family:footer-->
    </main>
    <!--family:scripts space.js-->
  </body>
</html>
