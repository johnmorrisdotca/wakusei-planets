<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1424'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%2313203a' stroke='%238fa1b8' stroke-width='4'/%3E%3Cellipse cx='50' cy='50' rx='42' ry='12' fill='none' stroke='%238fa1b8' stroke-width='3' transform='rotate(-20 50 50)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <!--family:header-->

      <section class="fam-felt space-stage" aria-labelledby="stage-h">
        <h2 id="stage-h" class="fam-sr" data-say="sp_stage">Space view</h2>
        <div id="sky" class="body-view" role="group" aria-label="Space view" data-say-label="sp_stage">
          <wakusei-space id="space" tabindex="0" time="now" speed="0" look="realistic" texture-base="textures/"></wakusei-space>
        </div>
        <p class="fam-fine stage-name" id="caption" role="status"></p>
        <p class="fam-fine" id="scale-note" role="status"></p>
      </section>
      <kazoku-view-controls id="controls" for="space" controls="advanced" address speed="0"></kazoku-view-controls>

      <div class="fam-panels">
        <div class="fam-panel controls">
          <p class="fam-fine" data-say="sp_help">Drag to turn the view.</p>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_goto">Go to</span>
            <div class="group fam-seg" id="gotos" role="group" aria-label="Go to" data-say-label="sp_goto">
              <button type="button" data-goto="earth" aria-pressed="true" data-say="sp_goto_earth">Earth</button>
              <button type="button" data-goto="moon" aria-pressed="false" data-say="sp_goto_moon">Moon</button>
              <button type="button" data-goto="sun" aria-pressed="false" data-say="sp_goto_sun">Sun</button>
              <button type="button" data-goto="inner" aria-pressed="false" data-say="sp_goto_inner">Inner planets</button>
              <button type="button" data-goto="solar-system" aria-pressed="false" data-say="sp_goto_solar">Whole solar system</button>
              <button type="button" data-goto="jupiter-moons" aria-pressed="false" data-say="sp_goto_jupiter">Jupiter and its moons</button>
            </div>
          </div>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_scale">Scale</span>
            <div class="group fam-seg" id="scales" role="group" aria-label="Scale" data-say-label="sp_scale">
              <button type="button" data-scale="compressed" aria-pressed="true" data-say="sp_scale_compressed">Compressed</button>
              <button type="button" data-scale="true" aria-pressed="false" data-say="sp_scale_true">True</button>
            </div>
            <span class="fam-label" data-say="sp_look">Look</span>
            <div class="group fam-seg" id="looks" role="group" aria-label="Look" data-say-label="sp_look">
              <button type="button" data-look="realistic" aria-pressed="true" data-say="look_realistic">Realistic</button>
              <button type="button" data-look="painted" aria-pressed="false" data-say="look_painted">Painted</button>
            </div>
          </div>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_light">Light</span>
            <div class="group fam-seg" id="lights" role="group" aria-label="Light" data-say-label="sp_light">
              <button type="button" data-light="sun" aria-pressed="true" data-say="sp_light_sun">The Sun's</button>
              <button type="button" data-light="lit" aria-pressed="false" data-say="sp_light_lit">Always lit</button>
            </div>
            <span class="fam-label" data-say="sp_show">Show</span>
            <button type="button" class="fam-button" id="orbits" aria-pressed="true" data-say="sp_orbits">Orbits</button>
            <button type="button" class="fam-button" id="names" aria-pressed="true" data-say="sp_names">Names</button>
          </div>
          <div class="fam-row">
            <span class="fam-label" data-say="sp_ride">Ride along</span>
            <div class="group fam-seg" id="rides" role="group" aria-label="Ride along" data-say-label="sp_ride">
              <button type="button" data-ride="" aria-pressed="true" data-say="sp_ride_off">Off</button>
              <button type="button" data-ride="moon" aria-pressed="false" data-say="sp_ride_moon">The Moon</button>
              <button type="button" data-ride="mars" aria-pressed="false" data-say="sp_ride_mars">Mars</button>
              <button type="button" data-ride="io" aria-pressed="false" data-say="sp_ride_io">Io, over Jupiter</button>
            </div>
            <span class="fam-label" data-say="sp_ride_look">Looking</span>
            <div class="group fam-seg" id="ride-looks" role="group" aria-label="Looking" data-say-label="sp_ride_look">
              <button type="button" data-ride-look="down" aria-pressed="true" data-say="sp_ride_down">Straight down</button>
              <button type="button" data-ride-look="horizon" aria-pressed="false" data-say="sp_ride_horizon">At the horizon</button>
            </div>
          </div>
          <div class="fam-row">
            <label class="field">
              <span data-say="sp_when">Date and time</span>
              <input type="datetime-local" id="when" class="fam-field" />
            </label>
            <button type="button" class="fam-button" id="now" aria-pressed="true" data-say="sp_now">Now</button>
            <kazoku-speed-buttons id="speeds" data-testid="speeds" steps="0 1 3600 86400 -3600" value="0"></kazoku-speed-buttons>
          </div>
        </div>
      </div>

      <!--family:unreviewed-->
      <!--family:footer-->
    </main>
    <!--family:scripts space.js-->
  </body>
</html>
