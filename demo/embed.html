<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wakusei Planets embed</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #frame { width: min(100vw, 100vh); height: min(100vw, 100vh); position: relative; }
      /* the family's credit line is kept out of the flex row (it would squeeze the frame): the corner credit (frame-credit.ts) is what a reader sees, this one is for a screen reader */
      kazoku-page-credits { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      wakusei-body:focus-visible, wakusei-portrait:focus-visible { outline: 3px solid #6cd0ff; outline-offset: -3px; }
      #frame.portrait { width: 100vw; height: auto; max-height: 100vh; }
      #frame.lineup { width: 100vw; height: auto; max-height: 100vh; }
      wakusei-lineup { --wakusei-size: 100%; --wakusei-radius: 0px; width: 100%; max-width: none; }
      wakusei-lineup:focus-visible { outline: 3px solid #6cd0ff; outline-offset: -3px; }
      wakusei-portrait { --wakusei-size: 100%; width: 100%; max-width: none; }
      wakusei-body { --wakusei-size: 100%; display: block; width: 100%; max-width: none; aspect-ratio: 1; }
    </style>
  </head>
  <body>
    <div id="frame" data-testid="frame"></div>
    <script type="module" src="embed.js"></script>
      <!--frame:credits-->
  </body>
</html>
