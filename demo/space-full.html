<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1424'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%2313203a' stroke='%238fa1b8' stroke-width='4'/%3E%3Cellipse cx='50' cy='50' rx='42' ry='12' fill='none' stroke='%238fa1b8' stroke-width='3' transform='rotate(-20 50 50)'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; --ink: #eef2fa; --line: rgba(255, 255, 255, 0.22); --panel: rgba(8, 12, 22, 0.66); --accent: #8fb0ff; }
      html, body { margin: 0; height: 100%; background: #04060c; color: var(--ink); font: 14px/1.3 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; overflow: hidden; }
      main { position: fixed; inset: 0; }
      wakusei-space { position: absolute; inset: 0; width: 100%; height: 100%; }
      wakusei-space:focus-visible { outline: 3px solid #6cd0ff; outline-offset: -3px; }
      .top { position: absolute; inset: 0 0 auto 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; pointer-events: none; }
      .top > * { pointer-events: auto; }
      .top h1 { margin: 0 auto 0 0; font-size: 1rem; font-weight: 600; text-shadow: 0 0 6px #000; pointer-events: none; }
      .top a { color: var(--ink); }
      time { font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); min-height: 20px; }
      .strip { position: absolute; inset-inline: 0; bottom: 56px; display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; padding: 0 8px; pointer-events: none; }
      .strip > * { pointer-events: auto; }
      .group { display: inline-flex; gap: 2px; padding: 2px; border-radius: 26px; background: var(--panel); border: 1px solid var(--line); }
      button.pill { min-width: 48px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 24px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
      button.pill[aria-pressed="true"], button.pill[aria-checked="true"] { background: var(--ink); color: #04060c; }
      button.pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      kazoku-view-controls { position: absolute; inset-inline: 8px auto; bottom: 8px; }
      @media (max-width: 640px) {
        .strip { bottom: 64px; }
      }
    </style>
  </head>
  <body>
    <main>
      <wakusei-space id="space" immersive tabindex="0" time="now" speed="3600" look="realistic" texture-base="textures/" tiles="tiles/"></wakusei-space>
      <div class="top">
        <h1 data-say="sf_title">Space, full screen</h1>
        <time id="when" aria-live="off"></time>
        <a href="space.html" data-say="sf_back">The space view</a>
      </div>
      <div class="strip">
        <div class="group" role="group" aria-label="Go to" data-say-label="sp_goto">
          <button type="button" class="pill" data-goto="earth" aria-pressed="true" data-say="sp_goto_earth">Earth</button>
          <button type="button" class="pill" data-goto="moon" aria-pressed="false" data-say="sp_goto_moon">Moon</button>
          <button type="button" class="pill" data-goto="inner" aria-pressed="false" data-say="sp_goto_inner">Inner planets</button>
          <button type="button" class="pill" data-goto="solar-system" aria-pressed="false" data-say="sp_goto_solar">Whole solar system</button>
        </div>
        <div class="group" role="group" aria-label="Hop" data-say-label="sp_hop">
          <button type="button" class="pill" id="hop-prev" aria-label="Previous body">&#8249; <span id="hop-prev-name"></span></button>
          <button type="button" class="pill" id="hop-next" aria-label="Next body"><span id="hop-next-name"></span> &#8250;</button>
        </div>
      </div>
      <kazoku-view-controls id="controls" for="space" layout="compact" overlay tilt-max="90"></kazoku-view-controls>
    </main>
    <!--family:scripts space-full.js-->
  </body>
</html>
