<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wakusei Planets code builder</title>
    <meta name="description" content="Choose a body, how it is drawn and its size, and copy the code that puts exactly that in your page: HTML, a module, React, Vue, Angular, Svelte or an iframe." />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
    <style>
      main.builder { max-width: 1040px; margin: 0 auto; padding: 16px 12px 40px; }
      .builder h1 { margin: 8px 0 4px; font-size: 1.6rem; }
      .builder .lede { margin: 0 0 14px; color: var(--muted); }
      .builder .rows { display: grid; gap: 10px; }
      .builder .row { display: grid; gap: 4px; }
      .builder .row .chips { justify-content: flex-start; margin: 0; }
    </style>
  </head>
  <body>
    <main class="builder">
      <h1>Code builder <span lang="ja">惑星</span></h1>
      <p class="lede">Choose a body, how it is drawn and its size. Copy the code that puts exactly that in your page. <a href="./">The full demo</a> · <a href="docs/index.html">The documentation</a></p>
      <div class="fam-panels">
        <div class="fam-panel">
          <kazoku-embed-panel id="embed-panel" sizes="160 240 320 480" docs-href="docs/" data-testid="builder-panel">
            <div slot="picker" class="rows">
              <div class="row"><span class="fam-label" id="group-title">Which planet's system</span><div class="chips" id="groups" role="group" aria-labelledby="group-title"></div></div>
              <div class="row"><span class="fam-label" id="body-title">Body</span><div class="chips" id="bodies" role="group" aria-labelledby="body-title"></div></div>
            </div>
            <div slot="options" class="rows">
              <div class="row"><span class="fam-label" id="look-title">Look</span><div class="chips" id="looks" role="group" aria-labelledby="look-title"></div></div>
              <div class="row"><span class="fam-label" id="sky-title">Sky</span><div class="chips" id="skies" role="group" aria-labelledby="sky-title"></div></div>
              <div class="row"><span class="fam-label" id="turn-title">Turning</span><div class="chips" id="turns" role="group" aria-labelledby="turn-title"></div></div>
            </div>
          </kazoku-embed-panel>
        </div>
      </div>
    </main>
    <script type="module" src="builder.js"></script>
  </body>
</html>
