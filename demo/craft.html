<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1424'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23e7c36a'/%3E%3Cpath d='M18 62c20-28 44-28 64 0' fill='none' stroke='%238fa1b8' stroke-width='3'/%3E%3Ccircle cx='70' cy='50' r='3' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <!--family:header-->

      <section class="fam-felt space-stage" aria-labelledby="stage-h">
        <h2 id="stage-h" class="fam-sr" data-say="cr_stage">Spacecraft</h2>
        <svg id="chart" viewBox="0 0 100 100" role="img" aria-labelledby="stage-h"></svg>
        <p class="fam-fine stage-name" id="where" role="status"></p>
      </section>

      <div class="fam-panels">
        <div class="fam-panel controls">
          <div class="fam-row">
            <span class="fam-label" data-say="cr_pick">Craft</span>
            <div class="group fam-seg" id="crafts" role="group" aria-label="Craft" data-say-label="cr_pick"></div>
          </div>
          <div class="fam-row">
            <label class="field"><span data-say="cr_when">Date</span><input id="when" class="fam-field" type="datetime-local" /></label>
            <button type="button" class="fam-button" id="play" aria-pressed="true" data-say="cr_play">Play</button>
          </div>
        </div>
      </div>

      <section class="fam-panel bodies" aria-labelledby="facts-h">
        <h2 id="facts-h" data-say="cr_facts">The craft</h2>
        <p id="facts"></p>
        <h2 id="events-h" data-say="cr_events">The voyage</h2>
        <ul id="events"></ul>
      </section>

      <p class="fam-fine credits"><span data-say="cr_credits">The path is fitted to JPL Horizons. The facts are the agencies' own pages, listed in NOTICE.md.</span> <a href="https://github.com/johnmorrisdotca/wakusei-planets/blob/main/NOTICE.md">NOTICE.md</a></p>

      <!--family:unreviewed-->
      <!--family:footer-->
    </main>
    <!--family:scripts craft.js-->
  </body>
</html>
