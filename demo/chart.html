<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <!--family:header-->
      <section class="chart-page" aria-labelledby="chart-h">
        <h2 id="chart-h" data-say="jc_title">The moons of Jupiter</h2>
        <p data-say="jc_lede">Every moon the catalogue gives Jupiter. A larger circle is a larger moon, and a higher circle is farther from Jupiter. The circles are enlarged so a small moon can be seen. Colour is the family.</p>
        <p id="chart-count"></p>
        <ul id="chart-legend" class="chart-legend"></ul>
        <p id="chart-estimated" class="fam-fine" data-say="jc_estimated">* size estimated</p>
        <div id="chart"></div>
        <p id="chart-source" class="fam-fine"></p>
      </section>
      <!--family:unreviewed-->
      <!--family:footer-->
    </main>
    <!--family:scripts chart.js-->
  </body>
</html>
