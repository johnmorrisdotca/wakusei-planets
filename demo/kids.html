<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1424'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%2313203a' stroke='%238fa1b8' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body class="kids">
    <main>
      <!--family:header-->

      <section class="fam-felt kids-intro" aria-labelledby="kids-h">
        <h2 id="kids-h" data-say="kids_title">Your weight and age on other worlds</h2>
        <p data-say="kids_intro">Type how much you weigh and the day you were born.</p>
      </section>

      <form class="fam-panel kids-form" id="form" autocomplete="off" onsubmit="return false">
        <div class="fam-row">
          <label class="kids-field">
            <span data-say="kids_weight">How much do you weigh?</span>
            <input type="number" inputmode="decimal" id="weight" class="fam-field" min="0" max="1000" step="any" autocomplete="off" data-testid="weight" />
          </label>
          <div class="group fam-seg" id="units" role="group" aria-label="Unit" data-say-label="kids_unit">
            <button type="button" data-unit="kg" aria-pressed="true">kg</button>
            <button type="button" data-unit="lb" aria-pressed="false">lb</button>
          </div>
        </div>
        <div class="fam-row">
          <label class="kids-field">
            <span data-say="kids_birthday">The day you were born</span>
            <input type="date" id="birthday" class="fam-field" autocomplete="off" data-testid="birthday" />
          </label>
        </div>
        <p class="fam-fine" data-say="kids_private">Nothing you type is saved or sent anywhere.</p>
        <p class="kids-warn" id="warn" role="alert" hidden></p>
      </form>

      <ul class="kids-cards" id="cards" data-testid="cards"></ul>

      <p class="fam-fine kids-note" data-say="kids_cloud">Jupiter, Saturn, Uranus and Neptune have no ground.</p>
      <p class="fam-fine kids-note" data-say="kids_how">How it works.</p>

      <!--family:unreviewed-->
      <!--family:footer-->
    </main>
    <!--family:scripts kids.js-->
  </body>
</html>
